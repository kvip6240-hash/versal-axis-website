name: Deploy website to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
    paths:
      - 'fieldwork-app/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

defaults:
  run:
    working-directory: fieldwork-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fieldwork-app/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
        run: |
          # Vite's hashed bundles never change: cache for a year.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Videos, frames, logos keep their names: cache for a day.
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=86400"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" > /dev/null
          echo "Deployed."
